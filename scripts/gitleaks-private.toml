# What would name a person or a machine once the repository is public: a
# path into a home folder, a service of the demo's host. Apart from gitleaks.toml, because
# gitleaks' default allowlist hides /home/ paths. The CI's runner folder is not a person's.
# A home folder starts a path: a users folder after a word (gno.land/r/gnoland/users, /api/users)
# is a route, and so is a name that does not start with a letter (/users/42). gitleaks takes the
# group, the path alone, as the secret the allowlist reads.
[[rules]]
id = "home-folder-path"
description = "A path into a home folder"
regex = '''(?i)(?:^|[^\w./~]|file://)(/(?:users|home)/[a-z_][\w.-]*)'''
[[rules.allowlists]]
regexes = ['''(?i)^/home/runner$''']

[[rules]]
id = "windows-home-folder-path"
description = "A path into a Windows home folder"
regex = '''(?i)\b[a-z]:\\{1,2}users\\{1,2}\w[\w.-]*'''

[[rules]]
id = "host-service"
description = "A service of the demo's host"
regex = '''(?i)\bn[8]n\b''' # a class, so the rule does not match itself

# No answer a wallet gave is ever kept. Adena's extension ends each success with a message the app never reads and no
# test needs (its own words for an account or a network, not its SDK's), and a JSON answer quotes its keys where the tests'
# TypeScript does not: either in a file marks an answer kept as it came.
[[rules]]
id = "adena-answer"
description = "An answer Adena's extension gave, kept as it came"
regex = '''(?i)\b(?:get (?:account|network) informatio[n]|transaction has been successfully execute[d])\.|"type"\s*:\s*"(?:GET_ACCOUNT|GET_NETWORK|CONNECTION_SUCCESS|SWITCH_NETWORK_SUCCESS|ADD_NETWORK_SUCCESS|SIGN_ARBITRARY|TRANSACTION_SUCCESS)"''' # classes and escapes, so the rule does not match itself
