<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adena recording</title>
<body style="font: 16px system-ui; max-width: 42rem; margin: 2rem auto; padding: 0 1rem">
  <h1>Adena recording (test only)</h1>
  <p>
    Nothing is asked of Adena until you press a button. Only the buttons 3 and 4 ask it to send a transaction, and Adena
    then asks you: this page signs nothing.
  </p>
  <p>
    <label>Realm <input id="realm" size="40" value="gno.land/r/demo/profile" /></label><br />
    <label>Function <input id="func" value="SetStringField" /></label><br />
    <label
      >Arguments, one per line
      <textarea id="args" rows="2">
Bio
gnoworld test</textarea>
    </label>
  </p>
  <p>
    <button id="read">1. Read the account and the network</button>
    <button id="switch">2. Switch to Onyx</button>
    <button id="sign">3. Call, and sign it in Adena</button>
    <button id="refuse">4. Call, and reject it in Adena</button>
  </p>
  <pre id="log"></pre>
  <script src="/recorder.js"></script>
  <script>
    const universe = __UNIVERSE__;
    const entries = [];
    let account = "";
    async function run(label, step) {
      const entry = await Recorder.record(window.adena, label, step);
      entries.push(entry);
      const data = entry.answer && entry.answer.data;
      if (step.call === "GetAccount" && data && typeof data.address === "string") account = data.address;
      document.getElementById("log").textContent = JSON.stringify(entries, null, 2);
      await fetch("/save", { method: "POST", body: JSON.stringify(entries, null, 2) });
    }
    const call = (label) => async () => {
      if (account === "") await run("account", { call: "GetAccount" });
      const text = document.getElementById("args").value;
      await run(label, {
        call: "DoContract",
        universe: { chainId: universe.chainId, name: universe.name, rpc: universe.rpc },
        request: {
          chainId: universe.chainId,
          caller: account,
          realm: document.getElementById("realm").value,
          func: document.getElementById("func").value,
          args: text === "" ? [] : text.split("\n"),
        },
      });
    };
    document.getElementById("read").onclick = async () => {
      await run("account", { call: "GetAccount" });
      await run("network", { call: "GetNetwork" });
    };
    document.getElementById("switch").onclick = () =>
      run("switch", { call: "SwitchNetwork", chainId: universe.chainId });
    document.getElementById("sign").onclick = call("call, signed");
    document.getElementById("refuse").onclick = call("call, rejected");
  </script>
</body>
