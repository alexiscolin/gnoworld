<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realism test</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <canvas aria-label="The worlds and the nebula" role="img"></canvas>
    <main>
      <h1>Realism test</h1>
      <nav aria-label="Views">
        <button type="button" data-view="gallery">1 Twelve worlds</button>
        <button type="button" data-view="close">2 Close</button>
        <button type="button" data-view="eclipse">3 Star behind</button>
        <button type="button" data-view="nebula">4 Nebula</button>
      </nav>
      <p data-testid="world"></p>
      <p class="keys">Left and right: another world. N: the other nebula. S: another seed. P: hide this panel.</p>
      <dl>
        <dt>Renderer</dt>
        <dd data-testid="renderer"></dd>
        <dt>Memory</dt>
        <dd data-testid="memory"></dd>
        <dt>Frame</dt>
        <dd data-testid="frame"></dd>
      </dl>
    </main>
    <footer></footer>
  </body>
</html>
