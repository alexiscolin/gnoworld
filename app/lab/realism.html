<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realism test</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <canvas aria-label="The worlds" role="img"></canvas>
    <main>
      <h1>Realism test</h1>
      <nav aria-label="Views">
        <button type="button" data-view="gallery">1 Twelve worlds</button>
        <button type="button" data-view="close">2 Close</button>
        <button type="button" data-view="eclipse">3 Star behind</button>
        <button type="button" data-view="earth">5 Earth</button>
        <button type="button" data-view="stages">6 Stages</button>
        <a href="?view=cosmos">7 Cosmos</a>
        <button type="button" data-view="gallery24">8 All 24</button>
        <button type="button" data-view="stations">Stations</button>
        <button type="button" data-view="earthsys">Earth's system</button>
        <button type="button" data-view="earthtop">From above</button>
      </nav>
      <p data-testid="world"></p>
      <p class="keys">
        Left and right: another world. Brackets: another stage. S: another seed. P: hide this panel. T: the tuning
        panel.
      </p>
    </main>
    <footer></footer>
  </body>
</html>
