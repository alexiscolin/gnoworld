<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 36 36">
  <!-- gno.world's mark, in the tokens' cream on their space (tokens.css); the page's icon, and the
       source of the PWA's PNGs, drawn from it by Chromium: icon-192.png and icon-512.png at their
       sizes; icon-maskable-512.png at 80% of 512 centred on the space, so the mark keeps inside the
       circle of radius 2/5 of the side that a platform's mask never cuts (Web App Manifest, §2.3). -->
  <rect x="-2" y="-2" width="36" height="36" rx="8" fill="#05070d"/>
  <g fill="none" stroke="#f2efea" stroke-width="1.4">
    <circle cx="16" cy="16" r="13.5" pathLength="24" stroke-dasharray="0 1" stroke-linecap="round" transform="rotate(135 16 16)"/>
    <circle cx="16" cy="16" r="8"/>
  </g>
  <g fill="#f2efea">
    <circle cx="16" cy="16" r="3.4"/>
    <circle cx="24" cy="16" r="1.9"/>
    <circle cx="6.9" cy="25.4" r="1.6"/>
  </g>
</svg>
