# The demo's static server (docs/plans/slice-1c.md; deploy/test.sh proves each line): the client's
# files as a static host serves them, behind the demo's password, with a limit per visitor, whose
# address Tailscale passes through the PROXY protocol, and nothing indexed. Since slice 3 (3e), Ergo's
# WebSocket at /ws and the server at /api/, the visitor's address handed on, the password kept here.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    # Room for held requests, two connections each (docs/OPERATIONS.md, "Open connections"; F208, F638); the
    # files they take, from compose.yaml's ulimits (F645).
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        text/x-script data;
    }
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Compressed, as the gate's budgets measure the client (ADR-0001 §12); HTML always is.
    gzip on;
    # Level 6, zlib's default level: nginx's own 1 sent the built scripts 15% bigger (zlib on the 15 scripts of
    # app/build/client/assets, 2026-10-27: 141,383 B at level 1, 122,464 B at 6; F683).
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json text/x-script image/svg+xml;

    log_format visitor '$proxy_protocol_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout visitor;

    # A first visit loads the pages' files and the worker's precache at once: twice its 110 files in slice 6, 220
    # requests, under a burst of 320 (Alexis, 2026-11-01; 160 refused 44 of them, F3385; 60 refused half, F2134).
    limit_req_zone $proxy_protocol_addr zone=visitors:1m rate=20r/s;
    # The login's own: the server's limit (10 a minute a visitor) comes first, this one past 20 at once.
    limit_req_zone $proxy_protocol_addr zone=login:1m rate=1r/s;
    limit_req_status 429;
    # The requests a visitor holds at once, a WebSocket and a stream counting while they last (F208), and short
    # waits on a client that sends nothing more.
    limit_conn_zone $proxy_protocol_addr zone=open:1m;
    limit_conn_status 429;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    # The build's table of Content-Security-Policy, one for each page by its path (app/src/csp.ts, 5f): $csp is the policy of
    # the page nginx answers with, its own scripts' hashes, or the one with none for any other answer. It also sets the
    # table's hash sizes (map_hash_max_size, map_hash_bucket_size), which its keys need, before any map: the first map sets
    # them to their defaults, and nginx refuses them twice (F2459).
    include /etc/nginx/csp.conf;

    # A WebSocket's upgrade handed on; a plain request closes.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # A hashed file never changes, so its success is kept a year; an error (a 401, a 429) and
    # anything else revalidate, or a browser would keep the error. One header for all, so no
    # location needs headers of its own (which would drop the server's).
    map $status$uri $cache_control {
        default "no-cache";
        ~^(200|206|304)/assets/ "public, max-age=31536000, immutable";
        # The server and Ergo say their own (an empty value adds none); nginx's own 401 or 429 there, none,
        # which no cache keeps by heuristic. The headers above reach them too, nosniff twice, harmless (F624).
        ~^[0-9]+/(api/|ws$) "";
        # The prices file, rewritten every 5 minutes by the server's timer: a minute is kept, then asked again.
        ~^(200|304)/markets\.json$ "public, max-age=60";
    }

    server {
        listen 8080 proxy_protocol;
        root /usr/share/nginx/html;
        auth_basic "gno.world demo";
        auth_basic_user_file /run/secrets/demo_htpasswd;
        limit_req zone=visitors burst=320 nodelay;
        limit_conn open 32;
        # A backslash is no separator to nginx on Linux but one to the server's URL parser: /api/x/..\login/
        # would skip the login's own limit (F617). $uri is decoded, so %5C is refused too; no path has one.
        if ($uri ~ "\\\\") { return 400; }

        # `always`, so a 401 or a 404 carries them too.
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        # A link to another site sends it nothing of the page it left (F682).
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control $cache_control always;
        # The build's Content-Security-Policy for this answer's page: its own script hashes, from the table above.
        add_header Content-Security-Policy $csp always;

        # As tests/e2e/serve.mjs: the file the path spells, case and all, else the SPA's fallback, 404.
        error_page 404 /__spa-fallback.html;
        location / {
            try_files $uri $uri/index.html =404;
        }

        # The prices (5m): the server's timer writes them into a volume this mounts read-only. A missing file is a 404,
        # the status the page reads. No header here: a location that adds one drops the server's (nosniff, policy).
        # Whoever runs code in the server owns that volume: a link there to web's own secret is refused, not followed.
        location = /markets.json {
            root /markets;
            disable_symlinks on from=$document_root;
            try_files $uri =404;
        }

        # Ergo's WebSocket: the visitor's address from the PROXY protocol, whatever the client sent; a
        # quiet connection kept an hour.
        location = /ws {
            proxy_pass http://ergo:8097;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header X-Real-IP $proxy_protocol_addr;
            proxy_set_header Authorization "";
            # The session's cookie is the server's alone: Ergo keeps a cookie it is sent and writes it into the
            # auth script's input, and it needs only a ticket (decision 143, F711).
            proxy_set_header Cookie "";
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # The server: the same address; the stream (SSE) handed on as it comes, a heartbeat every 15 s.
        location /api/ {
            proxy_pass http://server:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $proxy_protocol_addr;
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header Authorization "";
            # What the server takes (16 KiB): a larger body stops here, before it is buffered in memory.
            client_max_body_size 16k;
            proxy_buffering off;
            proxy_read_timeout 1h;

            location /api/login/ {
                proxy_pass http://server:8080;
                limit_req zone=visitors burst=320 nodelay;
                limit_req zone=login burst=20 nodelay;
            }
        }
    }

    # Docker's health check, from inside the container only.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /health {
            return 204;
        }
    }
}
