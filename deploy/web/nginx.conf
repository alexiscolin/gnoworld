# The demo's static server (docs/plans/slice-1c.md; deploy/test.sh proves each line): the client's
# files as a static host serves them, behind the demo's password, with a limit per visitor, whose
# address Tailscale passes through the PROXY protocol, and nothing indexed. Since slice 3 (3e), Ergo's
# WebSocket at /ws and the server at /api/, the visitor's address handed on, the password kept here.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
# Room for held requests, two connections each (docs/OPERATIONS.md, "Open connections"; F208, F638).
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        text/x-script data;
    }
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Compressed, as the gate's budgets measure the client (ADR-0001 §12); HTML always is.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json text/x-script image/svg+xml;

    log_format visitor '$proxy_protocol_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout visitor;

    # A first visit loads the pages' files and the worker's precache at once: about 40 requests.
    limit_req_zone $proxy_protocol_addr zone=visitors:1m rate=20r/s;
    # The login's own: the server's limit (10 a minute a visitor) comes first, this one past 20 at once.
    limit_req_zone $proxy_protocol_addr zone=login:1m rate=1r/s;
    limit_req_status 429;
    # The requests a visitor holds at once, a WebSocket and a stream counting while they last (F208), and short
    # waits on a client that sends nothing more.
    limit_conn_zone $proxy_protocol_addr zone=open:1m;
    limit_conn_status 429;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    # A WebSocket's upgrade handed on; a plain request closes.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # A hashed file never changes, so its success is kept a year; an error (a 401, a 429) and
    # anything else revalidate, or a browser would keep the error. One header for all, so no
    # location needs headers of its own (which would drop the server's).
    map $status$uri $cache_control {
        default "no-cache";
        ~^(200|206|304)/assets/ "public, max-age=31536000, immutable";
        # The server and Ergo say their own (an empty value adds none); nginx's own 401 or 429 there, none,
        # which no cache keeps by heuristic. The headers above reach them too, nosniff twice, harmless (F624).
        ~^[0-9]+/(api/|ws$) "";
    }

    server {
        listen 8080 proxy_protocol;
        root /usr/share/nginx/html;
        auth_basic "gno.world demo";
        auth_basic_user_file /run/secrets/demo_htpasswd;
        limit_req zone=visitors burst=60 nodelay;
        limit_conn open 32;
        # A backslash is no separator to nginx on Linux but one to the server's URL parser: /api/x/..\login/
        # would skip the login's own limit (F617). $uri is decoded, so %5C is refused too; no path has one.
        if ($uri ~ "\\\\") { return 400; }

        # `always`, so a 401 or a 404 carries them too.
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $cache_control always;
        # The build's Content-Security-Policy, with every page's script hashes (app/src/csp.ts).
        include /etc/nginx/csp.conf;

        # As tests/e2e/serve.mjs: the file the path spells, case and all, else the SPA's fallback, 404.
        error_page 404 /__spa-fallback.html;
        location / {
            try_files $uri $uri/index.html =404;
        }

        # Ergo's WebSocket: the visitor's address from the PROXY protocol, whatever the client sent; a
        # quiet connection kept an hour.
        location = /ws {
            proxy_pass http://ergo:8097;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header X-Real-IP $proxy_protocol_addr;
            proxy_set_header Authorization "";
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # The server: the same address; the stream (SSE) handed on as it comes, a heartbeat every 15 s.
        location /api/ {
            proxy_pass http://server:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $proxy_protocol_addr;
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header Authorization "";
            proxy_buffering off;
            proxy_read_timeout 1h;

            location /api/login/ {
                proxy_pass http://server:8080;
                limit_req zone=visitors burst=60 nodelay;
                limit_req zone=login burst=20 nodelay;
            }
        }
    }

    # Docker's health check, from inside the container only.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /health {
            return 204;
        }
    }
}
