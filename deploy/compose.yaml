# The demo stack (docs/plans/slice-1c.md, ADR-0002 §7). Run it, from the repository's root:
#   docker compose -f deploy/compose.yaml --profile demo up -d --build
# and with Jarvis switched on (JARVIS=on), its profile too: --profile demo --profile jarvis (10j-4), once the door's key is
# made and the evals pass (docs/OPERATIONS.md, "Switching Jarvis on").
# Ops runs the same file with its own settings (.env) and secrets. deploy/test.sh proves it.
name: gnoworld-demo

# Every service: a read-only root, no capability, no new privilege, its logs rotated.
x-locked: &locked
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
  restart: unless-stopped

# The socket the server makes and Ergo dials for each login (3d), in their shared volume.
x-auth-socket: &auth-socket /run/gnoworld/auth.sock

# web's fixed address on the internal network, the one Ergo and the server believe (deploy/.env.example).
x-web-address: &web-address ${WEB_ADDRESS:-172.30.89.10}

x-tailscale-image: &tailscale-image tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d

services:
  web:
    <<: *locked
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    user: "101:101"
    # A fixed address: Ergo and the server believe the visitor's address from web's alone (3e).
    networks:
      inside:
        ipv4_address: *web-address
    secrets: [demo_htpasswd]
    # markets.json, which the server writes (5l) and this serves at /markets.json (5m): read-only here.
    volumes:
      - markets:/markets:ro
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    # Two files for each of nginx's 4,096 connections, set here: nginx, no root, cannot raise a hard limit (F645).
    ulimits:
      nofile: { soft: 8192, hard: 8192 }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # Its upstreams' names are read once, at its start: one Compose restarts restarts it, not one Docker
    # restarts after a crash (OPERATIONS.md, F622).
    depends_on:
      ergo: { condition: service_healthy, restart: true }
      server: { condition: service_healthy, restart: true }

  # The chat (slice 3's plan, 3e): Ergo's settings rendered at its start from these and its secret.
  ergo:
    <<: *locked
    build:
      context: ..
      dockerfile: deploy/ergo/Dockerfile
    user: "65532:65532"
    networks: [inside]
    environment:
      SERVER_NAME: ${SERVER_NAME:-irc.gnoworld.example}
      ORIGINS: ${ORIGINS:?set ORIGINS in deploy/.env, the app's own https origin}
      PROXY_FROM: *web-address
      INSIDE_SUBNET: ${INSIDE_SUBNET:-172.30.89.0/24}
      AUTH_SOCKET: *auth-socket
    secrets: [ergo_oper_password]
    volumes:
      - ergo:/data
      - auth:/run/gnoworld
    cpus: 0.4
    # 2,000 guests joining one room took Ergo to 344 MiB, and Go past 128 threads, which a pids_limit counts:
    # "failed to create new OS thread (have 129 already)", Ergo dead (3n's load runs). It starts no process of its own.
    mem_limit: 512m
    pids_limit: 1024
    healthcheck:
      test: [CMD, /ircd-bin/probe, "127.0.0.1:6667"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s

  # The server (slice 3): the login, the rooms, the bot; OpenAI through the way out, as Node's proxy.
  server:
    <<: *locked
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    user: "65532:65532"
    networks:
      # A fixed address, which its API binds alone (HOST): jarvis's network reaches no port of the server's (10j's V12).
      inside:
        ipv4_address: ${SERVER_ADDRESS:-172.30.89.11}
      jarvis: {}
      # The admin API's listener (10g), on an address of a network nobody else joins: a console joins it to reach it.
      admin:
        ipv4_address: ${ADMIN_ADDRESS:-172.30.92.10}
    environment:
      HOST: ${SERVER_ADDRESS:-172.30.89.11}
      PORT: "8080"
      DATABASE: /data/gnoworld.db
      ORIGINS: ${ORIGINS:?set ORIGINS in deploy/.env, the app's own https origin}
      TRUSTED_PROXY: *web-address
      LOG_PEPPER_FILE: /run/secrets/log_pepper
      AUTH_SOCKET: *auth-socket
      ERGO_HOST: ergo
      ERGO_PORT: "6667"
      ERGO_OPER_PASSWORD_FILE: /run/secrets/ergo_oper_password
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      # Ergo's volume, read-only, measured against its cap at each retention tick (3n-b).
      ERGO_DATA: /ergo
      ERGO_DATA_MB: ${ERGO_DATA_MB:-1024}
      # The demo's way out; ops names its own proxy.
      HTTPS_PROXY: ${EGRESS_PROXY:-http://guard:4750}
      NO_PROXY: ergo,jarvis,localhost,127.0.0.1
      NODE_USE_ENV_PROXY: "1"
      # The prices timer's file (5l): CoinGecko's prices every 5 minutes, in a volume of their own.
      MARKETS_FILE: /markets/markets.json
      # The worlds job's file (7c): the default universe's realms grouped into worlds, in the same volume, served at /worlds.json; its
      # count beside it (7n2), worlds-count.json, served at /worlds-count.json.
      WORLDS_FILE: /markets/worlds.json
      # The preview job's file (8f): the hubs' realms' home pages, each read by the moderation check before it is written, in the same volume,
      # served at /previews.json; through the same RPC as the worlds job, so the way out lets no host out for it.
      PREVIEWS_FILE: /markets/previews.json
      # The same read takes the default universe's block height from its RPC (the host the way out lets out besides CoinGecko's and OpenAI's).
      UNIVERSES_FILE: /app/app/data/universes.json
      # The door to jarvis (10g), on the network only the two share; off unless JARVIS=on, the setting jarvis reads.
      JARVIS: ${JARVIS:-off}
      JARVIS_URL: http://jarvis:8081
      # The key the door sends jarvis in a header and jarvis asks of every request (10u-g2): one secret, the server's and jarvis's alone.
      JARVIS_DOOR_KEY_FILE: /run/secrets/jarvis_door_key
      # The guest chat (D430): on unless GUEST_CHAT=off, its undo; its limits, the server's own defaults (config.ts), an hour's names
      # for one visitor and for all, and the guests alive at once (F13950: none of them reached the server).
      GUEST_CHAT: ${GUEST_CHAT:-on}
      GUEST_NAMES_PER_VISITOR_HOUR: ${GUEST_NAMES_PER_VISITOR_HOUR:-10}
      GUEST_NAMES_PER_HOUR: ${GUEST_NAMES_PER_HOUR:-600}
      GUEST_LIVING: ${GUEST_LIVING:-5000}
      # The admin API (10g, ADR-0002 §6): its sites are the console's, never a public one (ORIGINS).
      ADMIN_HOST: ${ADMIN_ADDRESS:-172.30.92.10}
      ADMIN_PORT: "8082"
      ADMIN_ORIGINS: ${ADMIN_ORIGINS:-}
    secrets: [log_pepper, ergo_oper_password, openai_api_key, jarvis_door_key]
    volumes:
      - server:/data
      - auth:/run/gnoworld
      - ergo:/ergo:ro
      - markets:/markets
    cpus: 0.4
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test:
        [
          CMD,
          /nodejs/bin/node,
          -e,
          "fetch('http://' + process.env.HOST + ':8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s

  # Jarvis (slice 10; ADR-0002 §5, §7): its own image and user, off unless JARVIS=on (then it reads its key and reaches
  # gnomcp, which runs in jarvis_reader, a container of its own with no secret). It listens on its address of the network it
  # shares with the server alone, and goes out through a proxy of its own (egress_jarvis). /ask and /budgets ask no session:
  # the network walls them, and the door's key (jarvis_door_key) is asked of every request besides (10u-g2).
  # Its profile alone, out of the demo's cap (10j-4): without it the door answers off, or not_ready when on (10l-1).
  jarvis:
    <<: *locked
    profiles: [jarvis]
    build:
      context: ..
      dockerfile: deploy/jarvis/Dockerfile
    user: "65533:65533"
    init: true
    # Its drain (JARVIS_DRAIN_S), then gnomcp's close (4 s at most) and the spans' (5 s), with room (D178).
    stop_grace_period: 35s
    networks:
      jarvis:
        ipv4_address: ${JARVIS_ADDRESS:-172.30.91.10}
      jarvis_out: {}
      # The reader's network, jarvis and the reader alone: how jarvis reaches gnomcp.
      reader: {}
    environment:
      JARVIS: ${JARVIS:-off}
      JARVIS_HOST: ${JARVIS_ADDRESS:-172.30.91.10}
      JARVIS_PORT: "8081"
      # The name the server's JARVIS_URL gives, which a request's Host must name (F5288).
      JARVIS_HOSTNAMES: jarvis
      JARVIS_DATABASE: /data/jarvis.db
      # The demo's budgets, a day (D47): the file keeps them from the first start, an admin changes them (D173).
      JARVIS_BUDGET_USD: ${JARVIS_BUDGET_USD:-3}
      JARVIS_TRANSLATION_BUDGET_USD: ${JARVIS_TRANSLATION_BUDGET_USD:-1}
      JARVIS_DRAIN_S: "20"
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      JARVIS_DOOR_KEY_FILE: /run/secrets/jarvis_door_key
      # gnomcp is not here: one connection to the reader's bridge, the reader's address and port 8083 (10u-g2).
      JARVIS_GNOMCP_ADDRESS: ${READER_ADDRESS:-172.30.97.10}:8083
      # Named after app/data/universes.json's universes, as gnomcp.toml's profiles are.
      JARVIS_PROFILES: onyx,gnoland
      JARVIS_INDEXER_PROFILES: onyx,gnoland
      JARVIS_GNOSCOPE: ${JARVIS_GNOSCOPE:-off}
      OTEL_SERVICE_NAME: jarvis
      # The demo's way out for jarvis alone; ops names its own proxy.
      HTTPS_PROXY: ${JARVIS_EGRESS_PROXY:-http://guard:4751}
      NO_PROXY: localhost,127.0.0.1
      NODE_USE_ENV_PROXY: "1"
    secrets: [anthropic_api_key, jarvis_door_key]
    volumes:
      - jarvis:/data
    cpus: 0.3
    # Node alone now, gnomcp being the reader's; the heap is 70% of it (deploy/jarvis/Dockerfile).
    mem_limit: 384m
    pids_limit: 128
    # Its budgets, which it serves on or off, asked by the name it takes and with the door's key (no /health route: 10i).
    healthcheck:
      test:
        [
          CMD,
          /nodejs/bin/node,
          -e,
          "require('node:http').get({ host: process.env.JARVIS_HOST, port: 8081, path: '/budgets', headers: { host: 'jarvis', 'x-jarvis-key': require('node:fs').readFileSync(process.env.JARVIS_DOOR_KEY_FILE, 'utf8').trim() } }, (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s
    # Its start checks gnomcp through the reader: the reader is healthy first, and restarts it.
    depends_on:
      jarvis_reader: { condition: service_healthy, restart: true }

  # gnomcp, alone (10u-g2, D13987): its release image, a bridge that gives it a TCP port, one gnomcp a connection (two at
  # most: jarvis keeps one, a restart overlaps by one), and a relay that gives it a way out (deploy/jarvis-reader/main.go).
  # gnomcp ignores HTTPS_PROXY, so each chain host is named in /etc/hosts to one loopback address, where the relay reads the
  # TLS hello's server name, refuses one off READER_HOSTS and opens a CONNECT tunnel to it through egress_reader; the TLS
  # stays between gnomcp and the host. Its caps are a ceiling not measured on a running stack (D-row of 10u-g2). No secret, no volume but a tmpfs, a user of its own, and a network shared with jarvis alone.
  # Its ports below 1024 are open to its user in its own network namespace (sysctl), where a capability would be added back.
  jarvis_reader:
    <<: *locked
    profiles: [jarvis]
    build:
      context: ..
      dockerfile: deploy/jarvis-reader/Dockerfile
    user: "65531:65531"
    networks:
      reader:
        ipv4_address: ${READER_ADDRESS:-172.30.97.10}
      reader_out: {}
    environment:
      READER_LISTEN: ${READER_ADDRESS:-172.30.97.10}:8083
      READER_GNOMCP: /usr/local/bin/gnomcp
      READER_CONFIG: /etc/gnomcp/profiles.toml
      READER_PROXY: guard:4753
      READER_MAX: "2"
      # The relay's names, the same four as extra_hosts and deploy/egress/reader-acl.yaml, in any order (jarvis/src/config.test.ts
      # derives them from app/data/universes.json and holds the three to them).
      READER_HOSTS: rpc.onyx.testnets.gno.land,indexer.onyx.testnets.gno.land,rpc.gno.land,indexer.gno.land
    extra_hosts:
      - "rpc.onyx.testnets.gno.land:127.0.0.2"
      - "indexer.onyx.testnets.gno.land:127.0.0.2"
      - "rpc.gno.land:127.0.0.2"
      - "indexer.gno.land:127.0.0.2"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cpus: 0.2
    mem_limit: 160m
    pids_limit: 48
    healthcheck:
      test: [CMD, /probe, "${READER_ADDRESS:-172.30.97.10}:8083"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      egress_reader: { condition: service_healthy, restart: true }

  # The demo's only way out: it holds the network Tailscale shares, refuses every private address
  # (the host, its LAN, any tailnet), then sleeps. It alone has NET_ADMIN (docs/decisions.md).
  guard:
    <<: *locked
    profiles: [demo]
    image: *tailscale-image
    entrypoint: [sh, /guard/guard.sh]
    stop_signal: SIGKILL # its sleep, as PID 1, ignores SIGTERM: a stop would wait 10 s for nothing
    user: "0:0"
    cap_add: [NET_ADMIN]
    environment:
      XTABLES_LOCKFILE: /tmp/xtables.lock
      # Its own address on jarvis's way out's network, by which guard.sh finds that network (10j's review, V2).
      JARVIS_OUT_ADDRESS: ${GUARD_JARVIS_ADDRESS:-172.30.95.2}
      # And its address on the reader's way out's network (10u-g2).
      READER_OUT_ADDRESS: ${GUARD_READER_ADDRESS:-172.30.99.2}
    volumes:
      - ./guard:/guard:ro
    networks:
      inside: {}
      outside: {}
      jarvis_out:
        ipv4_address: ${GUARD_JARVIS_ADDRESS:-172.30.95.2}
      reader_out:
        ipv4_address: ${GUARD_READER_ADDRESS:-172.30.99.2}
    cpus: 0.1
    mem_limit: 32m
    pids_limit: 16
    healthcheck:
      test: [CMD-SHELL, iptables-nft -S OUTPUT | grep -qx -- '-P OUTPUT DROP']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      web: { condition: service_healthy }

  # The demo's way out (decision 151): the hosts of deploy/egress/acl.yaml alone, in the guard's network behind its rules.
  egress:
    <<: *locked
    profiles: [demo]
    build:
      context: ..
      dockerfile: deploy/egress/Dockerfile
    user: "65532:65532"
    network_mode: service:guard
    cpus: 0.1
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: [CMD, /probe, "127.0.0.1:4750"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # A guard restarted holds a new network: the way out restarts with it.
    depends_on:
      guard: { condition: service_healthy, restart: true }

  # jarvis's way out (10j): the hosts of deploy/egress/jarvis-acl.yaml alone, on 4751 in the guard's network, whose rules
  # take 4751 from jarvis's network alone (guard.sh): the server's list and jarvis's never mix.
  egress_jarvis:
    <<: *locked
    profiles: [jarvis]
    build:
      context: ..
      dockerfile: deploy/egress/Dockerfile
    user: "65532:65532"
    network_mode: service:guard
    entrypoint:
      [
        "/smokescreen",
        "--config-file",
        "/etc/smokescreen/config.yaml",
        "--listen-port",
        "4751",
        "--egress-acl-file",
        "/etc/smokescreen/jarvis-acl.yaml",
      ]
    cpus: 0.1
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: [CMD, /probe, "127.0.0.1:4751"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      guard: { condition: service_healthy, restart: true }

  # The reader's way out (10u-g2): the hosts of deploy/egress/reader-acl.yaml alone, on 4753 in the guard's network, whose rules
  # take 4753 from the reader's network alone (guard.sh): neither jarvis's list nor the server's reaches it, nor it theirs.
  egress_reader:
    <<: *locked
    profiles: [jarvis]
    build:
      context: ..
      dockerfile: deploy/egress/Dockerfile
    user: "65532:65532"
    network_mode: service:guard
    entrypoint:
      [
        "/smokescreen",
        "--config-file",
        "/etc/smokescreen/config.yaml",
        "--listen-port",
        "4753",
        "--egress-acl-file",
        "/etc/smokescreen/reader-acl.yaml",
      ]
    cpus: 0.1
    mem_limit: 48m
    pids_limit: 32
    healthcheck:
      test: [CMD, /probe, "127.0.0.1:4753"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      guard: { condition: service_healthy, restart: true }

  tailscale:
    <<: *locked
    profiles: [demo]
    image: *tailscale-image
    network_mode: service:guard
    environment:
      TS_AUTHKEY: file:/run/secrets/ts_authkey
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-gnoworld-demo}
      TS_EXTRA_ARGS: --advertise-tags=tag:gnoworld-demo
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SOCKET: /tmp/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    secrets: [ts_authkey]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9002/healthz]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    # A guard restarted holds a new network: Tailscale restarts with it, never on the old one.
    depends_on:
      guard: { condition: service_healthy, restart: true }

networks:
  # No way out, and no gateway: a container here reaches no address of the host either.
  inside:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    # web's fixed address is in it (deploy/.env.example).
    ipam:
      config:
        - subnet: ${INSIDE_SUBNET:-172.30.89.0/24}
  # jarvis and the server alone, jarvis's address fixed (JARVIS_HOST): as sealed as the internal network.
  jarvis:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    ipam:
      config:
        - subnet: ${JARVIS_SUBNET:-172.30.91.0/24}
  # jarvis and the guard alone, for jarvis's way out (4751).
  jarvis_out:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    # Fixed, so the guard finds it by its own address in it (GUARD_JARVIS_ADDRESS), never by jarvis's name.
    ipam:
      config:
        - subnet: ${JARVIS_OUT_SUBNET:-172.30.95.0/24}
  # jarvis and its reader alone, the reader's address fixed (JARVIS_GNOMCP_ADDRESS): the way jarvis reaches gnomcp (10u-g2).
  reader:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    ipam:
      config:
        - subnet: ${READER_SUBNET:-172.30.97.0/24}
  # The reader and the guard alone, for the reader's way out (4753).
  reader_out:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    # Fixed, so the guard finds it by its own address in it (GUARD_READER_ADDRESS).
    ipam:
      config:
        - subnet: ${READER_OUT_SUBNET:-172.30.99.0/24}
  # The admin API's listener alone: the console joins it (slice 12).
  admin:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    ipam:
      config:
        - subnet: ${ADMIN_SUBNET:-172.30.92.0/24}
  outside: {}

volumes:
  tailscale: {}
  ergo: {}
  server: {}
  # jarvis's file (D45): its budgets and its caches, which it alone mounts.
  jarvis: {}
  # markets.json, which the server writes and the home page reads (5l, 5m).
  markets: {}
  # The auth socket's folder, which the server makes the socket in and Ergo dials.
  auth: {}

secrets:
  demo_htpasswd:
    file: ${DEMO_HTPASSWD_FILE:-./secrets/demo_htpasswd}
  ts_authkey:
    file: ${TS_AUTHKEY_FILE:-./secrets/ts_authkey}
  ergo_oper_password:
    file: ${ERGO_OPER_PASSWORD_FILE:-./secrets/ergo_oper_password}
  log_pepper:
    file: ${LOG_PEPPER_FILE:-./secrets/log_pepper}
  openai_api_key:
    file: ${OPENAI_API_KEY_FILE:-./secrets/openai_api_key}
  # Read by jarvis alone, and only when on; a file must be there even off (any text): Compose wants it.
  anthropic_api_key:
    file: ${ANTHROPIC_API_KEY_FILE:-./secrets/anthropic_api_key}
  # The door's key (10u-g2): the server sends it, jarvis asks it of every request; both read it when on, and jarvis's health
  # check reads it. A file must be there even off. docs/OPERATIONS.md makes it.
  jarvis_door_key:
    file: ${JARVIS_DOOR_KEY_FILE:-./secrets/jarvis_door_key}
