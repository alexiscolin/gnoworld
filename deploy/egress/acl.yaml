# The hosts the server may reach: OpenAI's API, which the server's check asks, CoinGecko's, which
# the prices timer asks, the RPC of the default universe, where the same timer reads the block height,
# the mainnet's node, where the door reads a name (JARVIS_NAMES_RPC), and each universe's indexer, which
# the worlds job reads, each by its full name, never its domain. The RPC's host is the one of
# app/data/universes.json's default universe, the names' node the door's default, and the indexers' the ones of every
# universe there: server/src/prices/universes.test.ts fails when they differ. jarvis has a list of its own
# (jarvis-acl.yaml). Read by the proxy and by deploy/test.sh. A host is matched as the request names it, then resolved and
# refused if its address is private (config.yaml).
version: v1
services: []
default:
  project: gnoworld
  action: enforce
  allowed_domains:
    - api.coingecko.com
    - api.openai.com
    - rpc.onyx.testnets.gno.land
    - rpc.gno.land
    - indexer.onyx.testnets.gno.land
    - indexer.gno.land
