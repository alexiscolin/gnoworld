# The hosts the server may reach (decision 151): OpenAI's API, which the server's check asks (3i), CoinGecko's, which
# the prices timer asks (5l), the RPC of the default universe, where the same timer reads the block height (decision of
# 2026-10-31), and the mainnet's node, where the door reads a name (JARVIS_NAMES_RPC, D120), each by its full name, never
# its domain. The RPC's host is the one of app/data/universes.json's default universe, and the names' node the door's
# default: server/src/prices/universes.test.ts fails when they differ. jarvis has a list of its own (jarvis-acl.yaml).
# Read by the proxy and by deploy/test.sh. A host is matched as the request names it, then resolved and refused if its
# address is private (config.yaml).
version: v1
services: []
default:
  project: gnoworld
  action: enforce
  allowed_domains:
    - api.coingecko.com
    - api.openai.com
    - rpc.onyx.testnets.gno.land
    - rpc.gno.land
