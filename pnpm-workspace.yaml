packages:
  - app
  - server
  - jarvis
  - packages/*

# Supply chain, made explicit: no package younger than a day, no dependency build script
# unless it is listed in allowBuilds, and no version whose trust evidence dropped compared
# with its earlier releases.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# No pnpmfile runs: pnpm loads one at every install and run, with the access of whoever runs pnpm
# (docs/review/findings.md, F087).
ignorePnpmfile: true
# semver 6.3.1 is the fix of GHSA-c2qf-rxjj-qqgw, released by npm's team in July 2023 before
# semver 6 had provenance; @babel/core 7, which React's hooks lint needs, requires it.
trustPolicyExclude:
  - "semver@6.3.1"
engineStrict: true
# qs below 6.16.0 has three denial-of-service advisories (docs/review/findings.md, F025); it
# comes only through StrykerJS's typed-rest-client.
# follow-redirects 1.16.1 (GHSA-mrwp-f3q8-3g9p, high) comes through @gnolang/tm2-js-client's axios; glob 13
# (GHSA-3g3m-2fjr-6pw4, moderate) through Storybook's docgen; minimatch 10 (GHSA-g3hv-75wg-m249, moderate) through
# ESLint, typescript-eslint, StrykerJS and glob. Read by scripts/audit.py on 2026-10-31.
overrides:
  qs: "^6.16.0"
  follow-redirects: "^1.16.2"
  glob: "^14.0.3"
  minimatch: "^11.0.3"
allowBuilds:
  esbuild: false # its postinstall only re-fetches the binary optionalDependencies already install
  unrs-resolver: false # its postinstall only re-fetches the native binding, which optionalDependencies already install
# @web3auth/auth and @toruslabs/session-manager, under @adena-wallet/sdk, list the Linux binaries
# of two build tools as optional dependencies; neither tool is in the tree, so nothing loads them.
ignoredOptionalDependencies:
  - "@nx/nx-linux-x64-gnu"
  - "@rollup/rollup-linux-x64-gnu"
